services:
  agenthowl:
    build: .
    image: agenthowl:local
    container_name: agenthowl
    ports:
      - "${AGENTHOWL_PORT:-8000}:8000"  # 宿主机端口可用 AGENTHOWL_PORT 覆盖
    volumes:
      # 对局事件 / Agent 档案 / Provider（含密钥，0600）/ 跨局记忆 —— 全部留在宿主机
      - ./backend/data:/app/backend/data
    env_file:
      - path: .env
        required: false
    environment:
      # 容器内的 localhost 不是宿主机：本地 Ollama / 宿主机代理请用 host.docker.internal
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      # 描述声线的锚点音频在宿主机 backend/data/voices（随 data 挂载）；TTS 在宿主机跑，要按宿主机路径找它
      - AGENTHOWL_TTS_REF_DIR=${AGENTHOWL_TTS_REF_DIR:-${PWD}/backend/data/voices}
      # 语音：AGENTHOWL_TTS_URL 请在 .env 里设成 http://host.docker.internal:8880（TTS 在宿主机跑）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
